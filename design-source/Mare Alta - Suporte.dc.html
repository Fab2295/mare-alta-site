<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Suporte · Maré Alta</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&amp;family=Shrikhand&amp;display=swap">
<style>
html,body{margin:0;padding:0;background:#FFF6E6}
body{font-family:'Baloo 2',system-ui,sans-serif;color:#2B2340;-webkit-font-smoothing:antialiased}
a{color:#1F8FA0;text-decoration:none}
a:hover{color:#146E86}
*{box-sizing:border-box}
</style>
</helmet>

<nav style="position:fixed;left:0;right:0;top:0;z-index:20;padding:14px clamp(14px,3vw,32px);pointer-events:none">
  <div style="pointer-events:auto;max-width:1200px;margin:0 auto;height:60px;border-radius:30px;background:rgba(255,246,230,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 6px 22px rgba(43,35,64,.16);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 8px 0 10px">
    <a href="Mare Alta - Site.dc.html" style="display:flex;align-items:center;gap:10px;color:#2B2340">
      <img src="mare/icone.svg" alt="" style="width:40px;height:40px;border-radius:10px;display:block">
      <span style="font-family:Shrikhand,serif;font-size:22px;line-height:1;padding-top:2px">Maré Alta</span>
    </a>
    <div style="display:flex;align-items:center;gap:4px;font-weight:700;font-size:16px">
      <a href="Mare Alta - Suporte.dc.html" style="height:44px;padding:0 14px;border-radius:22px;display:flex;align-items:center;color:#2B2340;background:rgba(43,35,64,.07)">Suporte</a>
      <a href="Mare Alta - Privacidade.dc.html" style="height:44px;padding:0 14px;border-radius:22px;display:flex;align-items:center;color:#2B2340" style-hover="background:rgba(43,35,64,.07);color:#2B2340">Privacidade</a>
    </div>
  </div>
</nav>

<header data-screen-label="Suporte" style="position:relative;height:clamp(380px,56vh,560px);overflow:hidden">
  <dc-import name="Mare Cena" mode="band" night="0" hint-size="100%,100%" style="position:absolute;inset:0"></dc-import>
  <div style="position:absolute;left:0;right:0;top:0;padding:clamp(110px,16vh,150px) clamp(20px,6vw,80px) 0">
    <div style="max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:10px">
      <h1 style="margin:0;font-family:Shrikhand,serif;font-weight:400;font-size:clamp(52px,8vw,96px);line-height:1;color:#2B2340;text-shadow:4px 5px 0 #FFC93C">Suporte</h1>
      <p style="margin:0;font-size:clamp(19px,2vw,23px);font-weight:800;color:#2B2340">Dúvidas sobre o jogo, compras e ajustes.</p>
    </div>
  </div>
</header>

<main style="position:relative;z-index:2;margin-top:-56px;background:#FFF6E6;border-radius:40px 40px 0 0;padding:clamp(40px,6vw,72px) clamp(20px,6vw,80px) 80px">
  <div style="max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:36px">
    <div style="display:flex;flex-direction:column;gap:12px">
      <sc-for list="{{ faqs }}" as="f" hint-placeholder-count="6">
        <div style="background:#FFFFFF;border-radius:24px;box-shadow:0 0 0 1px rgba(43,35,64,.08)">
          <button onClick="{{ f.toggle }}" aria-expanded="{{ f.open }}" style="all:unset;box-sizing:border-box;cursor:pointer;width:100%;min-height:64px;padding:16px 20px 16px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;font-family:'Baloo 2',sans-serif;font-size:19px;font-weight:800;color:#2B2340">
            <span>{{ f.q }}</span>
            <span style="flex:0 0 auto;width:36px;height:36px;border-radius:18px;background:{{ f.chipBg }};display:flex;align-items:center;justify-content:center;transform:{{ f.rot }};transition:transform .2s">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2B2340" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
            </span>
          </button>
          <sc-if value="{{ f.open }}" hint-placeholder-val="{{ false }}">
            <div style="padding:0 24px 22px;font-size:17px;font-weight:600;line-height:1.6;color:#5A4F6E;text-wrap:pretty">{{ f.a }}</div>
          </sc-if>
        </div>
      </sc-for>
    </div>

    <div style="background:#146E86;color:#FFF6E6;border-radius:30px;padding:clamp(24px,4vw,36px);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:20px">
      <div style="display:flex;flex-direction:column;gap:6px;max-width:460px">
        <h2 style="margin:0;font-family:Shrikhand,serif;font-weight:400;font-size:34px;line-height:1.05">Falar com a gente</h2>
        <p style="margin:0;font-size:17px;font-weight:600;line-height:1.55;color:#E3F3EE">Conte o modelo do iPhone, a versão do iOS e o que aconteceu. Um print da tela ajuda.</p>
      </div>
      <a href="mailto:{{ email }}?subject=Mar%C3%A9%20Alta%20%C2%B7%20Suporte" style="height:56px;padding:0 26px;border-radius:28px;background:#FFC93C;color:#2B2340;display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;box-shadow:0 5px 0 #D99A12" style-hover="color:#2B2340;transform:translateY(-1px)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2B2340" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"></rect><path d="M4 7l8 6 8-6"></path></svg>
        Enviar e-mail
      </a>
    </div>
  </div>
</main>

<footer style="background:#2B2340;color:#FFF6E6;padding:22px clamp(20px,6vw,80px)">
  <div style="max-width:1200px;margin:0 auto;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px 24px;font-size:15px;font-weight:700">
    <span>© 2026 Maré Alta</span>
    <div style="display:flex;gap:6px">
      <a href="Mare Alta - Site.dc.html" style="height:44px;padding:0 14px;border-radius:22px;display:flex;align-items:center;color:#FFF6E6" style-hover="background:rgba(255,246,230,.12);color:#FFF6E6">Início</a>
      <a href="Mare Alta - Privacidade.dc.html" style="height:44px;padding:0 14px;border-radius:22px;display:flex;align-items:center;color:#FFF6E6" style-hover="background:rgba(255,246,230,.12);color:#FFF6E6">Privacidade</a>
    </div>
  </div>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;email&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;suporte@marealta.app&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { open: 0 };
  renderVals() {
    const items = [
      { q: 'Como restaurar o Passe do Jangadeiro?', a: 'Abra Ajustes e toque em Restaurar compras, usando o mesmo Apple ID da compra. O passe é uma compra única e volta sem cobrar de novo.' },
      { q: 'O que o Passe do Jangadeiro inclui?', a: 'Sem anúncios entre partidas, +10 s de sol sem assistir anúncio e conchas em dobro sem anúncio.' },
      { q: 'Os anúncios são obrigatórios?', a: 'Os anúncios recompensados são sempre opcionais: no fim da partida você escolhe se quer +10 s de sol ou dobrar as conchas. "Jogar de novo" continua sendo o botão principal.' },
      { q: 'Como trocar o idioma?', a: 'Em Ajustes, escolha Português ou English.' },
      { q: 'Como desligar som, música ou vibração?', a: 'Em Ajustes há uma chave para Efeitos sonoros, outra para Música e outra para Vibração.' },
      { q: 'Como conectar ao Game Center?', a: 'Em Ajustes, toque em Game Center. A conexão é feita com a sua conta da Apple.' },
      { q: 'Onde ficam minhas velas e jangadas?', a: 'Na Coleção. As conquistadas aparecem em cor; as bloqueadas aparecem em silhueta, indicando se saem por conchas ou pela loja.' }
    ];
    return {
      email: this.props.email ?? 'suporte@marealta.app',
      faqs: items.map((it, i) => {
        const open = this.state.open === i;
        return { ...it, open, rot: open ? 'rotate(45deg)' : 'none', chipBg: open ? '#FFC93C' : '#FFF6E6', toggle: () => this.setState({ open: open ? -1 : i }) };
      })
    };
  }
}
</script>
</body>
</html>
